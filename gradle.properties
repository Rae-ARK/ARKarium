# Project-wide Gradle settings.

# JVM args for the Gradle daemon. Room's annotation processor (kapt) and the
# Kotlin compiler are memory-hungry, so give the daemon enough heap to avoid
# OutOfMemoryError on CI runners and modest local machines.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Required: this project depends on androidx.* artifacts (Compose, Room,
# DataStore, Lifecycle, DocumentFile). AGP needs this explicitly set to true.
android.useAndroidX=true

# All dependencies here are already AndroidX-native, so the legacy support
# library -> AndroidX rewrite step is unnecessary and only slows the build.
android.enableJetifier=false

# Generates a separate, non-transitive R class per module. This is the
# modern AGP default and avoids resource-reference leakage between modules
# as the project grows past a single :app module.
android.nonTransitiveRClass=true

# Speeds up incremental builds; safe for a single-module project like this.
org.gradle.caching=true
org.gradle.parallel=true

# Kotlin's official code style (consistent formatting defaults for the compiler/IDE).
kotlin.code.style=official