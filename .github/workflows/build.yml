name: Build APK

on:
  push:
    branches: [ main, develop, release ]
  pull_request:
    branches: [ main, develop, release ]

jobs:
  build:
    runs-on: ubuntu-latest
    # checks: write is what lets the "Publish Test Report" step below create its own
    # check run (the red X on a failing test, separate from the job's own pass/fail) -
    # contents: read is the default this would otherwise fall back to, kept explicit
    # now that the job declares a permissions block at all.
    permissions:
      contents: read
      checks: write
    # Without this, the default `run:` shell here is `bash -e {0}` - NOT
    # `-o pipefail` - so any `foo | tee bar.log` step (see "Build with
    # Gradle" below) reports success based on `tee`'s exit code, not
    # `foo`'s. That let a real `./gradlew assembleDebug` failure show as a
    # green check with no APK and no uploaded logs. Setting pipefail job-wide
    # makes every piped step here fail correctly when the left-hand command does.
    defaults:
      run:
        shell: bash -o pipefail -e {0}

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Provisions a verified Gradle distribution via Gradle's official action instead of
    # relying on a pre-committed gradle-wrapper.jar (which this repo doesn't have yet).
    # This also generates/refreshes the wrapper files to match gradle-wrapper.properties.
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.1.1

    - name: Regenerate Gradle wrapper
      run: gradle wrapper --gradle-version 8.1.1

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Build with Gradle
      # Piped through tee so the full compiler/Gradle output survives into a file we
      # can upload on failure - previously this only ever went to the Actions log
      # itself, which requires a signed-in GitHub session to view, and the "Upload
      # Build Logs on failure" step below only grabbed build/reports and
      # build/outputs/logs, neither of which ever contains this step's stdout. The
      # default bash shell GitHub Actions uses for `run:` already sets `-o pipefail`,
      # so piping to tee here does NOT swallow gradlew's real exit code - the step
      # still fails correctly if the build fails.
      run: ./gradlew assembleDebug --stacktrace 2>&1 | tee build-output.log

    # Separate step/task/log from assembleDebug above, deliberately `if: always()` -
    # same reasoning as the build step's own pipefail comment: a real
    # testDebugUnitTest failure needs to still show up (and still fail the job) even
    # when assembleDebug already failed for an unrelated reason, instead of being
    # silently skipped because an earlier step failed. JVM unit tests only
    # (testDebugUnitTest), not androidTest - this runner has no device/emulator, same
    # limitation docs/implementation/engineering-backlog.md's rung 9 already
    # notes for MigrationTest.
    - name: Run unit tests
      if: always()
      run: ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee test-output.log

    # Turns each JUnit XML result into its own GitHub check run with a pass/fail icon
    # per test (a red X on the specific failing test, not just the job's overall
    # cross) - without this, a test failure is only visible by opening
    # test-output.log or the uploaded HTML report below. `if: always()` so this still
    # runs (and still reports) when the step above failed; `fail-on-error: true` is
    # what makes this check itself show a cross when any test failed, rather than
    # just listing results on an otherwise-green check.
    #
    # Guarded to same-repo runs only: dorny/test-reporter needs checks: write on
    # GITHUB_TOKEN to create that check run, but GitHub strips write permissions from
    # GITHUB_TOKEN on a pull_request run whose head is a fork, regardless of this
    # file's own permissions: block - so without this guard the step doesn't skip,
    # it fails, on every external contributor's PR, for a token-permission reason
    # that has nothing to do with whether their tests actually pass. A fork PR's
    # results are still visible via test-output.log and build/test-results/ in the
    # failure-only log upload below.
    - name: Publish Test Report
      uses: dorny/test-reporter@v1
      if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      with:
        name: Unit Test Results
        path: '**/build/test-results/**/*.xml'
        reporter: java-junit
        fail-on-error: true

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: arkarium-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Upload Build Logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build-output.log
          test-output.log
          **/build/reports/
          **/build/outputs/logs/
          **/build/test-results/
