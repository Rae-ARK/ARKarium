name: Build Release APK

# Manual only - unlike build.yml's debug build (which runs on every push to
# main/develop), a release is a deliberate act: pick the branch/ref via the
# Actions tab's "Run workflow" dropdown (or `gh workflow run "Build Release
# APK" --ref <branch>`) rather than firing on every push.
on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    # A step's own `if:` condition cannot see the `secrets` context directly
    # (GitHub Actions rejects that at workflow-parse time - "Unrecognized
    # named-value: 'secrets'" - which is exactly the 422 this repo hit trying
    # to dispatch this workflow). `secrets` IS readable from job-level `env:`,
    # though, and job-level env IS visible inside every step's `if:` - so the
    # presence check has to be computed here and read back via `env.` below,
    # not via `secrets.` directly in the step's `if:`.
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.ARKARIUM_KEYSTORE_BASE64 != '' }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Same wrapper-provisioning approach as build.yml - see that file's comment
    # for why this repo doesn't commit a pre-built gradle-wrapper.jar.
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.1.1

    - name: Regenerate Gradle wrapper
      run: gradle wrapper --gradle-version 8.1.1

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    # app/build.gradle.kts's signingConfigs block reads exactly these four
    # ARKARIUM_RELEASE_* env vars and silently falls back to an UNSIGNED release
    # build if any are missing - so this step has to actually produce a real
    # file on disk at the path it exports, not just reference a secret name.
    # Add these secrets under Settings -> Secrets and variables -> Actions:
    #   ARKARIUM_KEYSTORE_BASE64        (base64 of your .jks/.keystore file -
    #                                   `base64 -w0 your.keystore`)
    #   ARKARIUM_RELEASE_STORE_PASSWORD
    #   ARKARIUM_RELEASE_KEY_ALIAS
    #   ARKARIUM_RELEASE_KEY_PASSWORD
    # If ARKARIUM_KEYSTORE_BASE64 isn't set, this step is skipped entirely and
    # the build below proceeds unsigned (same fallback build.gradle.kts already
    # documents for a local build with no env vars exported) rather than
    # failing outright - useful for verifying the release build type compiles
    # before a signing key has been generated yet.
    - name: Decode signing keystore
      if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
      env:
        ARKARIUM_KEYSTORE_BASE64: ${{ secrets.ARKARIUM_KEYSTORE_BASE64 }}
      run: |
        echo "$ARKARIUM_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
        echo "ARKARIUM_RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

    - name: Build signed release APK
      env:
        ARKARIUM_RELEASE_STORE_PASSWORD: ${{ secrets.ARKARIUM_RELEASE_STORE_PASSWORD }}
        ARKARIUM_RELEASE_KEY_ALIAS: ${{ secrets.ARKARIUM_RELEASE_KEY_ALIAS }}
        ARKARIUM_RELEASE_KEY_PASSWORD: ${{ secrets.ARKARIUM_RELEASE_KEY_PASSWORD }}
      run: ./gradlew assembleRelease --stacktrace 2>&1 | tee release-build-output.log

    - name: Upload release APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: arkarium-release-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 90

    - name: Upload Build Logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: release-build-logs
        path: |
          release-build-output.log
          **/build/reports/
          **/build/outputs/logs/
