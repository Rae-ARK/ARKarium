name: Room schema

# Generates Room's exported schema JSON (app/schemas/<db>/<version>.json) with a real
# build and commits any NEW file back to the branch, so nobody has to run
# `./gradlew assembleDebug` by hand and remember to `git add` the result. MigrationTest
# (src/androidTest) replays upgrades from these files; see
# docs/arkarium/implementation/engineering-backlog.md, rungs 9 and 14.
#
# Three safety rules, all enforced below:
#   1. Only NEW schema files are ever committed. A released version's JSON is history;
#      if a build rewrites an existing one the job fails instead of overwriting it
#      (that means an entity changed without bumping APP_DATABASE_VERSION).
#   2. Pushes made with GITHUB_TOKEN do not start new workflow runs, so committing back
#      cannot loop; the message also carries [skip ci] for other workflows.
#   3. Pull requests from forks cannot be pushed to, so on a PR this only checks.
#
# Runs automatically when anything that can change the schema changes, and by hand
# (Actions > Room schema > Run workflow). The manual run takes an optional `source_ref`:
# a commit to build the schema FROM instead of the branch tip. Use it to recover the JSON
# of an older version that was bumped past before anyone generated it - e.g. the commit
# just before a version bump. That commit must already contain the `room.schemaLocation`
# setting (it does from the "Rung 9" commit onward).

on:
  push:
    branches: [ main, develop, release ]
    paths:
      - 'app/src/main/java/com/arkarium/app/data/**'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/room-schema.yml'
  pull_request:
    paths:
      - 'app/src/main/java/com/arkarium/app/data/**'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Optional commit/branch/tag to build the schema from (default: this branch)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: room-schema-${{ github.ref }}
  cancel-in-progress: false

jobs:
  schema:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -o pipefail -e {0}

    steps:
    - name: Check out the branch
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        # A PR run checks out a merge commit; push/manual runs check out the branch
        # itself so the commit below lands on it.
        ref: ${{ github.event_name == 'pull_request' && github.ref || github.ref_name }}

    - name: Check out the source ref to build from
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref != '' }}
      run: |
        git worktree add ../schema-src "${{ inputs.source_ref }}"
        echo "BUILD_DIR=$(cd ../schema-src && pwd)" >> "$GITHUB_ENV"

    - name: Build from the branch tip
      if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.source_ref != '') }}
      run: echo "BUILD_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.1.1

    # Same wrapper handling as build.yml: this repo has no committed gradle-wrapper.jar.
    - name: Regenerate Gradle wrapper
      working-directory: ${{ env.BUILD_DIR }}
      run: gradle wrapper --gradle-version 8.1.1 && chmod +x ./gradlew

    # KSP writes the schema as a side effect of compiling the Room database class, so
    # the Kotlin compile task is enough - no APK needed.
    - name: Generate schema
      working-directory: ${{ env.BUILD_DIR }}
      run: ./gradlew :app:kspDebugKotlin --stacktrace

    - name: Collect generated schema into the branch
      run: |
        set -e
        src="$BUILD_DIR/app/schemas"
        test -d "$src" || { echo "::error::No app/schemas was generated - is room.schemaLocation set?"; exit 1; }
        mkdir -p app/schemas
        if [ "$BUILD_DIR" != "$GITHUB_WORKSPACE" ]; then
          cp -rn "$src"/. app/schemas/
        fi
        # Rule 1: never rewrite an existing, tracked schema file.
        if ! git diff --quiet -- app/schemas; then
          echo "::error::An existing schema file changed. Bump APP_DATABASE_VERSION (and add a migration) instead of editing a released schema."
          git diff --stat -- app/schemas
          exit 1
        fi
        git status --short -- app/schemas

    - name: Commit new schema files
      if: ${{ github.event_name != 'pull_request' }}
      run: |
        set -e
        git add app/schemas
        if git diff --cached --quiet; then
          echo "Schema already up to date - nothing to commit."
          exit 0
        fi
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -m "Room schema: add exported schema JSON [skip ci]"
        git push

    # On a PR we can't push, so fail if the PR changes the schema without including the
    # new file - the author runs the build locally (or this workflow on their branch)
    # and commits it.
    - name: PR check - schema file is committed
      if: ${{ github.event_name == 'pull_request' }}
      run: |
        if [ -n "$(git status --porcelain -- app/schemas)" ]; then
          echo "::error::This change produces a Room schema file that is not committed. Run ./gradlew :app:kspDebugKotlin and commit app/schemas."
          git status --short -- app/schemas
          exit 1
        fi
